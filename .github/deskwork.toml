# deskwork: how agents file issues, record what blocks what, and keep the roadmap.
# The skill reads this file; it does nothing in this repository unless enabled is true.
enabled = true

# The roadmap, written and committed by `deskwork roadmap`.
roadmap = "roadmap.md"

# Where designs live. An issue links to a spec here rather than carrying the design.
designs = "docs/superpowers/specs/"

# The organisation's issue types.
issue_types = ["Bug", "Feature", "Task"]

# On every issue deskwork files: filed and not yet reviewed. A person removes it
# once the issue has been read and accepted.
triage_label = "triage"

# The Projects v2 board is the org board "6502" (https://github.com/orgs/dbhq-uk/projects/1),
# made on 14 October 2026. It is addressed by node id, never by title. Its Status
# options are GitHub's three (Todo, In Progress, Done) plus Triage, which init adds.
project = "PVT_kwDOEdX0bM4BnApc"
triage_status = "Triage"

[labels]
# capture --area X applies the label area:X. These are kinds of work that cut
# across machines. The machines keep their own labels (kim-1, bbc-micro, nes,
# electron, atari-2600) and the site keeps `site`; they are not repeated here.
area = ["core", "ci", "models", "speed", "rights"]
