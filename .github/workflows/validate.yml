name: Validate
# Filtering push to main leaves each commit covered once: by its pull request
# while it is in review, and by the push run after it merges, which is the run
# that proves main itself is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref, newest wins. Runs on main are exempt: they are the record of
# whether main is green at a given commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The first run downloads Harte's data, about 5 GB, before it is cached.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      # Dormann's assembler, as65, is a 32-bit Linux program.
      - name: 32-bit runtime for as65
        run: sudo apt-get update && sudo apt-get install -y libc6-i386 lib32stdc++6
      # Everything third-party is downloaded by the tests, pinned and
      # hash-checked, and kept here between runs. The key changes when a pin does.
      - name: Cache test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .testdata
          key: testdata-${{ hashFiles('tests/Dbhq.Cpu6502.Tests/Harte/harte.manifest', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs') }}
      # The trx logger is given no file name on purpose. With a fixed name,
      # every test project writes the same file and the last one to finish
      # overwrites the others, so a whole project's suites vanish from the
      # site's figures. Left to name its own files, it writes one per project.
      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=normal" --logger trx --results-directory TestResults
      # The site reads its figures from the test results, so the results become
      # a file here and the site job below picks it up. It is never committed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22'
      - name: Turn the test results into the site's results.json
        run: node site/scripts/make-results.mjs TestResults site/src/data/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results
          path: site/src/data/results.json
          if-no-files-found: error

  # The machines' browser builds, alongside the tests: the KIM-1, the BBC
  # Micro and the NES as .NET WebAssembly, compiled ahead of time, and their
  # ROMs (for the NES, its bundled game), read from roms/ and checked against
  # the pins in Pins.cs. The site job below puts them where the Astro build
  # copies them into dist. Nothing here is committed.
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build is a pure function of these inputs, so an unchanged machine
      # is restored rather than compiled again: AOT takes minutes. Each machine
      # has its own cache, keyed on the core, its own two projects and what the
      # build reads, so a change to one machine rebuilds that machine alone. The
      # workload version is in the keys, so moving the pin rebuilds every one. The
      # BBC Micro's build also publishes its preset discs, so its key hashes
      # machines/bbc-micro/discs/ too: a disc added or changed is never served
      # from a stale cache.
      - name: Cache the KIM-1's browser build
        id: kim-1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines/kim-1
          key: machine-kim-1-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/Dbhq.Machines.Kim1/**', 'src/Dbhq.Machines.Kim1.Wasm/**', 'src/Dbhq.Cpu6502/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs', 'site/src/lib/machines.mjs') }}
      - name: Cache the BBC Micro's browser build
        id: bbc-micro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines/bbc-micro
          key: machine-bbc-micro-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/Dbhq.Machines.BbcMicro/**', 'src/Dbhq.Machines.BbcMicro.Wasm/**', 'src/Dbhq.Cpu6502/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs', 'site/src/lib/machines.mjs', 'site/src/lib/bbc-discs.mjs', 'machines/bbc-micro/discs/**') }}
      - name: Cache the NES's browser build
        id: nes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines/nes
          key: machine-nes-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/Dbhq.Machines.Nes/**', 'src/Dbhq.Machines.Nes.Wasm/**', 'src/Dbhq.Cpu6502/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs', 'site/src/lib/machines.mjs') }}
      # The machines whose cache missed, by registry id, for the build below.
      - name: Which machines to build
        id: which
        env:
          KIM1_HIT: ${{ steps.kim-1.outputs.cache-hit }}
          BBC_HIT: ${{ steps.bbc-micro.outputs.cache-hit }}
          NES_HIT: ${{ steps.nes.outputs.cache-hit }}
        run: |
          IDS=""
          [ "$KIM1_HIT" = "true" ] || IDS="$IDS kim-1"
          [ "$BBC_HIT" = "true" ] || IDS="$IDS bbc-micro"
          [ "$NES_HIT" = "true" ] || IDS="$IDS nes"
          echo "building:${IDS:- none, all restored}"
          echo "ids=${IDS# }" >> "$GITHUB_OUTPUT"
      # The SDK is pinned here, not left at 10.0.x, because a workload version
      # belongs to one SDK feature band: 10.0.401 is a 10.0.400 band set.
      - if: steps.which.outputs.ids != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.400'
      - if: steps.which.outputs.ids != ''
        name: The wasm-tools workload, pinned
        run: dotnet workload install wasm-tools --version 10.0.401
      - if: steps.which.outputs.ids != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22'
      # Every machine whose cache missed: the KIM-1, the BBC Micro and the NES.
      # A machine's files are published with the site, but linked from no page
      # until the registry says it runs.
      - if: steps.which.outputs.ids != ''
        name: Build the machines and fetch their ROMs
        env:
          IDS: ${{ steps.which.outputs.ids }}
        working-directory: site
        run: node scripts/build-machines.mjs $IDS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: machines
          path: site/public/machines
          if-no-files-found: error

  # The site's own checks: the figures trace to the results, the registry agrees
  # with the family document, and every rule the site makes about itself holds.
  site:
    needs: [test, machines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: results
          path: site/src/data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: machines
          path: site/public/machines
      - name: Install
        working-directory: site
        run: npm ci
      # `npm test` runs the build through its pretest script. A silent skip looks
      # exactly like a pass, so the count is read back and a floor asserted, the
      # same one as deploy-site.yml.
      - name: Build and verify
        working-directory: site
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/site-test.log
          count() { grep -oE "(#|.) $1 [0-9]+" /tmp/site-test.log | grep -oE '[0-9]+$' | tail -1; }
          PASS=$(count pass); FAILED=$(count fail)
          echo "pass=${PASS:-unread} fail=${FAILED:-unread}"
          [ "${FAILED:-1}" = "0" ]
          # 468 tests as at 6 Oct 2026, with task 8's follow-up (the photographs
          # committed for the NES's outside model: credited, listed and hashed);
          # 467 as at 6 Oct 2026, after task 9's fix round (a model's region path on
          # a console it does not draw; tab keys with Alt, Ctrl or Meta left to the browser);
          # 465 with task 9 of the NES models done (the rule that
          # a machine claiming a model states case, the case's credits, a console the model
          # does not draw); 462 with task 9's second stage of the NES models (the
          # outside model: its entry, sizes, features, words, buttons and notes); 453 with
          # task 9's first stage (the
          # views of a cased machine as tabs: their markup, styles and loader); 447 after
          # task 7's fix round of the NES models (two
          # access tests: a count that falls is a new machine; 445 with task 7, the
          # board's inside model on the page, its legend, rates, results file and
          # credits; 423 with
          # task 6, the page's panel.nes
          # and its events; 416 with tasks 0 to 5 and 8 merged onto the NES's branch,
          # 369 before them, after the review of the NES's page; 368 with the page and
          # the NES counting, 351 with its registry record, try-it file and build, 342
          # before them that day with main's preset discs merged into the NES's branch;
          # 282 on main after the discs' second review, 292 on the branch).
          # Adding tests is expected; losing them is the failure this floor catches.
          # Raise the number when the suite grows, here and in the same step of
          # deploy-site.yml, which must hold the same number.
          [ "${PASS:-0}" -ge 468 ]
      # The KIM-1 page in a real browser: the built site served on 127.0.0.1
      # with its own CSP, the try-it program clicked in through the page's own
      # keypad, and the digits read back. Then the page's photograph loads, and
      # its 3D model loads only when scrolled to, draws, and follows the machine,
      # its underside's tracks show where the map puts them, and every photograph
      # in the photographs section loads (WebGL through Chrome's SwiftShader: the
      # runner has no GPU). The runner image ships Google Chrome.
      # Then the BBC Micro's page, on the same build: Start downloads it, it boots
      # to BASIC, PRINT 6*7 typed through the page's keys shows 42, the sound
      # turns on and off, a disc lists with *CAT and saves, Break restarts it,
      # and a preset disc from the library starts with Insert and run while the
      # visitor's own file still goes in after it (scripts/browser-check-bbc.mjs).
      # Then the NES's page: Start puts its game in, the frame recorded in
      # machines/nes/expected-frames.json is on the canvas to the pixel in both
      # regions, Start on the keyboard changes the picture, a test cartridge
      # built from bytes goes in through the picker, and a bad file and one too
      # big are refused with the machine carrying on (scripts/browser-check-nes.mjs).
      - name: The KIM-1, the BBC Micro and the NES run in a browser
        working-directory: site
        run: node scripts/browser-check.mjs

  dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No em or en dashes
        run: |
          if LC_ALL=C.UTF-8 git grep -InP '[\x{2013}\x{2014}]'; then
            echo "Use a plain hyphen, not an em or en dash"
            exit 1
          fi
