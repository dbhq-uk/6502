name: Validate
# Filtering push to main leaves each commit covered once: by its pull request
# while it is in review, and by the push run after it merges, which is the run
# that proves main itself is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref, newest wins. Runs on main are exempt: they are the record of
# whether main is green at a given commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The first run downloads Harte's data, about 5 GB, before it is cached.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      # Dormann's assembler, as65, is a 32-bit Linux program.
      - name: 32-bit runtime for as65
        run: sudo apt-get update && sudo apt-get install -y libc6-i386 lib32stdc++6
      # Everything third-party is downloaded by the tests, pinned and
      # hash-checked, and kept here between runs. The key changes when a pin does.
      - name: Cache test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .testdata
          key: testdata-${{ hashFiles('tests/Dbhq.Cpu6502.Tests/Harte/harte.manifest', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs') }}
      # The trx logger is given no file name on purpose. With a fixed name,
      # every test project writes the same file and the last one to finish
      # overwrites the others, so a whole project's suites vanish from the
      # site's figures. Left to name its own files, it writes one per project.
      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=normal" --logger trx --results-directory TestResults
      # The site reads its figures from the test results, so the results become
      # a file here and the site job below picks it up. It is never committed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22'
      - name: Turn the test results into the site's results.json
        run: node site/scripts/make-results.mjs TestResults site/src/data/results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          path: site/src/data/results.json
          if-no-files-found: error

  # The machines' browser builds, alongside the tests: the KIM-1 as .NET
  # WebAssembly, compiled ahead of time, and its monitor ROM, fetched from the
  # pin in Pins.cs and hash-checked. The site job below puts them where the
  # Astro build copies them into dist. Nothing here is committed.
  machines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build is a pure function of these inputs, so an unchanged machine
      # is restored rather than compiled again: AOT takes minutes. The workload
      # version is in the key, so moving the pin rebuilds.
      - name: Cache the machines' browser builds
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines
          key: machines-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs') }}
      # The SDK is pinned here, not left at 10.0.x, because a workload version
      # belongs to one SDK feature band: 10.0.401 is a 10.0.400 band set.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.400'
      - if: steps.cache.outputs.cache-hit != 'true'
        name: The wasm-tools workload, pinned
        run: dotnet workload install wasm-tools --version 10.0.401
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22'
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the machines and fetch their ROMs
        working-directory: site
        run: node scripts/build-machines.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machines
          path: site/public/machines
          if-no-files-found: error

  # The site's own checks: the figures trace to the results, the registry agrees
  # with the family document, and every rule the site makes about itself holds.
  site:
    needs: [test, machines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results
          path: site/src/data
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: machines
          path: site/public/machines
      - name: Install
        working-directory: site
        run: npm ci
      # `npm test` runs the build through its pretest script. A silent skip looks
      # exactly like a pass, so the count is read back and a floor asserted, the
      # same one as deploy-site.yml.
      - name: Build and verify
        working-directory: site
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/site-test.log
          count() { grep -oE "(#|.) $1 [0-9]+" /tmp/site-test.log | grep -oE '[0-9]+$' | tail -1; }
          PASS=$(count pass); FAILED=$(count fail)
          echo "pass=${PASS:-unread} fail=${FAILED:-unread}"
          [ "${FAILED:-1}" = "0" ]
          # 182 tests as at 2 Oct 2026. Adding tests is expected; losing them is
          # the failure this floor catches. Raise the number when the suite grows,
          # here and in the same step of deploy-site.yml, which must hold the same number.
          [ "${PASS:-0}" -ge 182 ]
      # The KIM-1 page in a real browser: the built site served on 127.0.0.1
      # with its own CSP, the try-it program clicked in through the page's own
      # keypad, and the digits read back. Then the page's photograph loads, and
      # its 3D model loads only when scrolled to, draws, and follows the machine
      # (WebGL through Chrome's SwiftShader: the runner has no GPU). The runner
      # image ships Google Chrome.
      - name: The KIM-1 runs in a browser
        working-directory: site
        run: node scripts/browser-check.mjs

  dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No em or en dashes
        run: |
          if LC_ALL=C.UTF-8 git grep -InP '[\x{2013}\x{2014}]'; then
            echo "Use a plain hyphen, not an em or en dash"
            exit 1
          fi
