name: deploy-site

# Push to main -> 6502.dbhq.uk is tested, built, deployed, the edge cache purged,
# and every page verified with a cache-buster.
#
# THE WHOLE TEST SUITE RUNS HERE, before the site is built, and that is the
# point. The site's figures are read from a results.json made from this run, so
# they describe the commit being deployed and not the last green check on some
# other one. If a test fails, nothing deploys.
#
# Cloudflare never builds from this repository: the Pages project is
# direct-upload and serves exactly what this workflow last uploaded. The
# project, its custom domain and the DNS record are Terraform, in
# infra/ in this repository, applied by hand and never from CI.
#
# THE DEPLOY IS SWITCHED OFF UNTIL THE SITE IS READY. It runs only when the
# repository variable SITE_DEPLOY is "true", which is set after the Cloudflare
# project exists and the secrets below are added. Until then a push to main
# leaves this workflow skipped rather than red. It also runs only from main:
# a manual run started from another branch is skipped, because the upload below
# is labelled main and would publish that branch's build as the live site.
#
# PATH FILTER. Wider than site/**: the figures come from the tests and the
# registry, so a change to the core, a machine or the registry changes the site
# without touching a file under site/.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "machines/**"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "6502.slnx"
      - "Directory.Build.props"
      - "bench/**"
      - "tools/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The machines' browser builds, in a job of their own that holds no token:
  # the KIM-1 and the BBC Micro as .NET WebAssembly, compiled ahead of time, and
  # their ROMs, read from roms/ and checked against the pins in Pins.cs. The
  # same job as validate.yml's. The deploy job puts its output where the Astro build copies
  # it into dist.
  machines:
    if: vars.SITE_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build is a pure function of these inputs, so an unchanged machine
      # is restored rather than compiled again: AOT takes minutes. Each machine
      # has its own cache, keyed on the core, its own two projects and what the
      # build reads, so a change to one machine rebuilds that machine alone. The
      # workload version is in the keys, so moving the pin rebuilds both.
      - name: Cache the KIM-1's browser build
        id: kim-1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines/kim-1
          key: machine-kim-1-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/Dbhq.Machines.Kim1/**', 'src/Dbhq.Machines.Kim1.Wasm/**', 'src/Dbhq.Cpu6502/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs', 'site/src/lib/machines.mjs') }}
      - name: Cache the BBC Micro's browser build
        id: bbc-micro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: site/public/machines/bbc-micro
          key: machine-bbc-micro-sdk-10.0.400-wasm-tools-10.0.401-${{ hashFiles('src/Dbhq.Machines.BbcMicro/**', 'src/Dbhq.Machines.BbcMicro.Wasm/**', 'src/Dbhq.Cpu6502/**', 'Directory.Build.props', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs', 'site/scripts/build-machines.mjs', 'site/src/lib/pins.mjs', 'site/src/lib/machines.mjs') }}
      # The machines whose cache missed, by registry id, for the build below.
      - name: Which machines to build
        id: which
        env:
          KIM1_HIT: ${{ steps.kim-1.outputs.cache-hit }}
          BBC_HIT: ${{ steps.bbc-micro.outputs.cache-hit }}
        run: |
          IDS=""
          [ "$KIM1_HIT" = "true" ] || IDS="$IDS kim-1"
          [ "$BBC_HIT" = "true" ] || IDS="$IDS bbc-micro"
          echo "building:${IDS:- none, both restored}"
          echo "ids=${IDS# }" >> "$GITHUB_OUTPUT"
      # The SDK is pinned here, not left at 10.0.x, because a workload version
      # belongs to one SDK feature band: 10.0.401 is a 10.0.400 band set.
      - if: steps.which.outputs.ids != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.400'
      - if: steps.which.outputs.ids != ''
        name: The wasm-tools workload, pinned
        run: dotnet workload install wasm-tools --version 10.0.401
      - if: steps.which.outputs.ids != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22'
      # Both machines: the KIM-1, and the BBC Micro, whose files are published
      # with the site but linked from no page until the registry says it runs.
      - if: steps.which.outputs.ids != ''
        name: Build the machines and fetch their ROMs
        env:
          IDS: ${{ steps.which.outputs.ids }}
        working-directory: site
        run: node scripts/build-machines.mjs $IDS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: machines
          path: site/public/machines
          if-no-files-found: error

  deploy:
    if: vars.SITE_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    needs: machines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # wrangler is pinned in site/package.json and site/package-lock.json, and
      # the deploy step runs that copy with --no, so it is never fetched fresh
      # while the Cloudflare token is in scope.
      # Actions are pinned to commit SHAs: this job holds a Cloudflare token with
      # write access, and a hijacked tag would run with it in scope.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 32-bit runtime for as65
        run: sudo apt-get update && sudo apt-get install -y libc6-i386 lib32stdc++6
      - name: Cache test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .testdata
          key: testdata-${{ hashFiles('tests/Dbhq.Cpu6502.Tests/Harte/harte.manifest', 'tests/Dbhq.Cpu6502.TestSupport/Pins.cs') }}

      # No trx file name, for the reason given in validate.yml: one file per
      # test project, or the last project to finish overwrites the rest.
      - name: Test the core and the machines
        run: dotnet test --configuration Release --logger trx --results-directory TestResults

      - name: Make the site's results.json
        run: node site/scripts/make-results.mjs TestResults site/src/data/results.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: machines
          path: site/public/machines

      - name: Install
        working-directory: site
        run: npm ci

      # `npm test` runs the build through its pretest script, so this one step is
      # build-and-verify. A silent skip looks exactly like a pass, so the count
      # is read back and a floor asserted.
      - name: Build and verify the site
        working-directory: site
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/site-test.log
          count() { grep -oE "(#|.) $1 [0-9]+" /tmp/site-test.log | grep -oE '[0-9]+$' | tail -1; }
          PASS=$(count pass); FAILED=$(count fail)
          echo "pass=${PASS:-unread} fail=${FAILED:-unread}"
          [ "${FAILED:-1}" = "0" ]
          # 322 tests as at 5 Oct 2026 (with the NES models' task 4, the board's copper on both faces and its track map; 317 with task 3, 312 with task 2, 308 with task 1, 303 with task 0).
          # Adding tests is expected; losing them is the failure this floor catches.
          # Raise the number when the suite grows, here and in the same step of
          # validate.yml, which must hold the same number.
          [ "${PASS:-0}" -ge 322 ]

      # The same floor as "Every machine file must be serving" below, checked on
      # the build itself, so a build that is missing a machine fails here and
      # not after it has gone live. The check after the deploy stays: only the
      # edge shows the content types.
      - name: Both machines must be in the build
        working-directory: site
        run: |
          set -euo pipefail
          COUNT=$(find dist/machines -type f ! -name index.html | wc -l)
          echo "machine files in the build: ${COUNT}"
          [ "$COUNT" -ge 21 ] || { echo "only $COUNT machine files in the build - a machine is missing"; exit 1; }

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --no -- wrangler pages deploy dist --project-name 6502 --branch main

      - name: Purge the Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf --max-time 20 --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true'

      # THE LIST IS DERIVED FROM THE BUILD, not typed out here: a hardcoded list
      # once failed a deploy by naming a page that had correctly become a
      # redirect. Reading dist/ means a renamed or added page cannot leave this
      # step behind.
      - name: Every page must be serving
        working-directory: site
        run: |
          set -euo pipefail
          PAGES=$(cd dist && find . -name index.html -printf '%h\n' | sed 's|^\.||; s|$|/|' | sed 's|^/$|/|' | sort)
          echo "checking: $(echo "$PAGES" | tr '\n' ' ')"
          COUNT=0
          FAIL=0
          # A page that is not 200 is tried again for about 90 seconds before it
          # counts as a failure: the deploy step returns before the new version
          # has reached the edge, and a deploy that adds many pages (the BBC Micro
          # merge on 4 Oct 2026 added thirty) can get 404s for a few seconds.
          # Each try has its own cache-buster, because the same URL could hand
          # back the same cached 404 for the whole window. A page that never
          # reaches 200 still fails, exactly as before.
          for p in $PAGES; do
            TRY=0
            while :; do
              CODE=$(curl -s --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" "https://6502.dbhq.uk${p}?cb=${GITHUB_SHA}-${TRY}")
              [ "$CODE" = "200" ] && break
              TRY=$((TRY + 1))
              [ "$TRY" -le 18 ] || break
              echo "${p} -> ${CODE}, trying again in 5 seconds (${TRY} of 18)"
              sleep 5
            done
            echo "${p} -> ${CODE}"
            [ "$CODE" = "200" ] || FAIL=1
            COUNT=$((COUNT + 1))
          done
          # A find that matched nothing would pass the loop silently.
          [ "$COUNT" -ge 8 ] || { echo "only $COUNT pages found - the derivation is broken"; exit 1; }
          [ "$FAIL" = "0" ]

      - name: A missing page must return 404
        run: |
          set -euo pipefail
          CODE=$(curl -s --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" "https://6502.dbhq.uk/no-such-page/?cb=${GITHUB_SHA}")
          echo "missing page -> $CODE"
          [ "$CODE" = "404" ]

      # table-sort.js is here because machines-table.js imports it: a 404 on it
      # breaks that whole module, and the filters and sorting quietly vanish.
      # machine-host.js is here because kim-1.js imports it, for the same reason:
      # a 404 on it and the machine never starts. bbc-micro.js, bbc-keys.js and
      # bbc-audio.js are the BBC Micro's page: its driver, the key table the
      # driver imports, and the sound worklet it loads with addModule, which no
      # import names.
      # site/tests/build.test.mjs derives the required list from the built pages.
      # analytics.js and consent.js are in this list for a sharp reason. A 404 on
      # analytics.js means no analytics and nothing to opt out of. A 404 on
      # consent.js is worse: the notice never shows and Cookie settings stays
      # hidden, so a visitor who is being counted has no way to say no.
      # models/kim-1.js is loaded by model-loader.js only when a visitor reaches
      # the model, so no page names it; models/kim-1-tracks.webp is the track
      # map that bundle fetches. site/tests/model.test.mjs requires every model
      # in src/models/models.mjs, and its track map, to be in this list.
      - name: The machine-readable files must be serving
        run: |
          set -euo pipefail
          for f in sitemap-index.xml sitemap-0.xml robots.txt analytics.js consent.js machines-table.js table-sort.js chip.js kim-1.js machine-host.js bbc-micro.js bbc-keys.js bbc-audio.js model-loader.js models/kim-1.js models/kim-1-tracks.webp; do
            CODE=$(curl -s --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" "https://6502.dbhq.uk/${f}?cb=${GITHUB_SHA}")
            echo "${f} -> ${CODE}"
            [ "$CODE" = "200" ]
          done

      # The machines' files: the WebAssembly each machine page loads and its
      # ROM. THE LIST IS DERIVED FROM THE BUILD, like the pages above. A .wasm
      # must come back as application/wasm: WebAssembly.compileStreaming
      # refuses any other type, and the machine would not start.
      - name: Every machine file must be serving
        working-directory: site/dist
        run: |
          set -euo pipefail
          FILES=$(find machines -type f ! -name index.html | sort)
          COUNT=0
          FAIL=0
          for f in $FILES; do
            OUT=$(curl -s --max-time 20 --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code} %{content_type}" "https://6502.dbhq.uk/${f}?cb=${GITHUB_SHA}")
            echo "${f} -> ${OUT}"
            CODE=${OUT%% *}
            TYPE=${OUT#* }
            [ "$CODE" = "200" ] || FAIL=1
            case "$f" in
              *.wasm) [[ "$TYPE" == application/wasm* ]] || { echo "  ${f} is not served as application/wasm"; FAIL=1; } ;;
              *.js) [[ "$TYPE" == *javascript* ]] || { echo "  ${f} is not served as JavaScript"; FAIL=1; } ;;
            esac
            COUNT=$((COUNT + 1))
          done
          # 26 files as at 4 Oct 2026, 13 for each machine. The floor is what the
          # two must publish at the least: their ROMs (two halves for the KIM-1,
          # three for the BBC Micro) and, for each, the four runtime files
          # (dotnet.js, dotnet.native's .js and .wasm, dotnet.runtime.js),
          # CoreLib, the core, the machine and its host, which is 21. The KIM-1's
          # 13 alone cannot meet it, so a missing BBC Micro fails here. (It was
          # 6, set for the KIM-1 alone.)
          [ "$COUNT" -ge 21 ] || { echo "only $COUNT machine files found - the derivation is broken"; exit 1; }
          [ "$FAIL" = "0" ]

      # Headers only apply at the Cloudflare edge, so they can only be checked
      # after the deploy.
      - name: The response headers must be applied at the edge
        run: |
          set -euo pipefail
          H=$(curl -sI --max-time 20 --retry 3 --retry-delay 5 "https://6502.dbhq.uk/?cb=${GITHUB_SHA}" | tr -d '\r')
          echo "$H"
          grep -qi '^strict-transport-security:' <<<"$H"
          grep -qi '^content-security-policy:' <<<"$H"
          grep -qi '^x-content-type-options: nosniff' <<<"$H"
